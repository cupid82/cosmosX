<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="fade-in">
  <div class="chat-container">
    <div class="chat-header">
      <h1>CosmoLens Observatory</h1>
    </div>
    <div class="chat-box">
      <div class="messages" id="messages">
        <div class="message system">Please enter the galaxy name to begin observation.</div>
      </div>
      <div class="input-area">
        <input type="text" id="galaxyInput" placeholder="Enter galaxy name (e.g. NGC 4414)..." autocomplete="off" />
        <button id="sendBtn" title="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
