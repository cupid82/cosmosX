<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CosmoLens — Observatory Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Seamless entry fade curtain -->
  <div id="pageCurtain" class="curtain"></div>

  <!-- Minimal Nav Bar -->
  <header class="console-nav">
    <a href="/" class="nav-brand">
      <span class="status-dot"></span>
      <span class="mono">COSMOLENS &nbsp;·&nbsp; OBSERVATORY</span>
    </a>
    <a href="/" class="nav-back mono">
      <span>&larr; Return to Surface</span>
    </a>
  </header>

  <!-- Central Minimal Terminal -->
  <main class="console-container">
    <div class="console-flow">
      
      <!-- Welcome / Status Heading -->
      <div class="terminal-intro" id="terminalIntro">
        <p class="intro-tag mono">DEEP FIELD RESOLVER &bull; ONLINE</p>
        <h1 class="intro-title">What galaxy would you like to observe?</h1>
        <p class="intro-sub">Enter a catalog designation, NGC identifier, or deep-field coordinates.</p>
      </div>

      <!-- Feed / Messages Stream -->
      <div class="terminal-feed" id="chatFeed">
        <!-- Messages will append here cleanly -->
      </div>

      <!-- Minimal Input Bar -->
      <div class="input-wrapper">
        <div class="input-bar">
          <span class="prompt-symbol mono">&rsaquo;</span>
          <input 
            type="text" 
            id="galaxyInput" 
            placeholder="Enter galaxy name (e.g. NGC 4414, SMACS 0723)..." 
            autocomplete="off" 
            spellcheck="false"
            autofocus
          />
          <button id="sendBtn" class="send-button" aria-label="Send query">
            <span class="mono key-cue">&crarr;</span>
          </button>
        </div>

        <!-- Quick Target Suggestions -->
        <div class="quick-targets mono" id="quickTargets">
          <span class="targets-label">QUICK TARGETS:</span>
          <button class="target-chip" data-target="NGC 4414">NGC 4414</button>
          <button class="target-chip" data-target="SMACS J0723">SMACS J0723</button>
          <button class="target-chip" data-target="JWST-CL-0003">JWST-CL-0003</button>
          <button class="target-chip" data-target="Cartwheel Galaxy">Cartwheel</button>
          <button class="target-chip" data-target="Stephan's Quintet">Stephan's Quintet</button>
        </div>
      </div>

    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
